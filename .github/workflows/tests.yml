name: tests

on:
  push:
  pull_request:

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: mvn -B test
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: target/site/jacoco
